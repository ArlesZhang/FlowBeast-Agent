# MkDocs configuration for FlowBeast-Agent's documentation
# Project documentation site with i18n support (Vue/React style)

site_name: FlowBeast-Agent
site_description: AI-powered short-form drama content generation engine
site_url: https://ArlesZhang.github.io/FlowBeast-Agent/

# Repository
repo_name: FlowBeast-Agent
repo_url: https://github.com/ArlesZhang/FlowBeast-Agent
edit_uri: edit/main/docs/

# Theme
theme:
  name: material
  language: en
  features:
    - navigation.instant      # 页面瞬间加载，像单页应用一样丝滑
    - navigation.tracking     # URL 随滚动条位置自动更新锚点
    - toc.integrate           # 目录集成到侧边栏
    - content.code.copy       # 代码块复制按钮
    - content.code.annotate   # 代码注释功能（鼠标悬停显示解释）
    - content.tooltips        # 工具提示
    - content.action.edit     # 编辑按钮
    - content.action.view     # 查看按钮
    - header.autohide         # 自动隐藏头部
    - search.suggest          # 搜索建议
    - search.highlight        # 搜索高亮
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: Roboto Mono
  icon:
    logo: material/code-tags

# Markdown extensions
markdown_extensions:
  - attr_list
  - def_list
  - tables
  - admonition
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

# Plugins with i18n support
plugins:
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: zh
          name: 简体中文
          default: false
          build: true
          nav_translations:
            Home: 首页
            Getting Started: 快速开始
            Architecture: 架构
            Tech Debt: 技术债与路线图
            ADRs: 架构决策记录
            Overview: 概述
            0001 - FAISS: 0001 - FAISS
            0002 - Embedding: 0002 - Embedding
            Tech_Blog: 技术博客
            fast-api: FastAPI
  - search

# 显式导航配置（使用英文文件名，i18n 插件会自动翻译）
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Tech Debt: tech-debt.md
  - ADRs:
    - Overview: adrs/index.md
    - 0001 - FAISS: adrs/0001-faiss-for-fp3.md
    - 0002 - Embedding: adrs/0002-unified-embedding-interface.md
  - Tech_Blog: Tech_Blog/fast-api.md
# Extra configuration
extra:
  version: 0.3.2
