# MkDocs configuration for FlowBeast-Agent's documentation
# Project documentation site with i18n support (Vue/React style)

site_name: FlowBeast-Agent
site_description: AI-powered short-form drama content generation engine
site_url: https://ArlesZhang.github.io/FlowBeast-Agent/

# Repository
repo_name: FlowBeast-Agent
repo_url: https://github.com/ArlesZhang/FlowBeast-Agent
edit_uri: edit/main/docs/

# Theme
theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - content.action.view
    - header.autohide
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: Roboto Mono
  icon:
    logo: material/code-tags

# Markdown extensions
markdown_extensions:
  - attr_list
  - def_list
  - tables
  - admonition
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

# Plugins with i18n support
plugins:
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: zh
          name: 简体中文
          default: false
          build: true
  - search

# Navigation - pointing to i18n folder structure
nav:
  - Home: en/index.md
  - Getting Started: en/getting-started.md
  - Architecture: en/architecture.md
  - Tech Debt: en/tech-debt.md
  - ADRs:
    - Overview: en/adrs/index.md
    - 0001 - FAISS: en/adrs/0001-faiss-for-fp3.md
    - 0002 - Embedding: en/adrs/0002-unified-embedding-interface.md

# Extra configuration
extra:
  version: 0.3.2
